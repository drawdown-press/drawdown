<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (the two-panel Drawdown mark) -->

    <!-- Primary SEO -->
    <title>Drawdown — Press-Side Color Correction for Printers &amp; Sign Shops</title>
    <meta name="description" content="Enter the color you want and the color you're getting, and Drawdown tells you which inks to move to make them match. Free in your browser, no signup. Built for press operators, prepress, and wide-format sign shops." />
    <meta name="keywords" content="color correction, CMYK, Pantone to CMYK, prepress, ink correction, Delta E, wide format color, sign shop color, press color matching, GRACoL, color management" />
    <meta name="author" content="Drawdown" />
    <link rel="canonical" href="https://drawdown.press/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, most link previews) -->

    <meta property="og:site_name" content="Drawdown" />
    <meta property="og:title" content="Drawdown — Press-Side Color Correction" />
    <meta property="og:description" content="Enter the color you want and the color you're getting. Drawdown tells you which inks to move to make them match. Free in your browser, no signup." />
    <meta property="og:url" content="https://drawdown.press/" />
    <meta property="og:image" content="https://drawdown.press/drawdown-og.png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Drawdown — press-side color correction tool" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: tells Google this is a software application, free tier, browser-based -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Drawdown",
      "url": "https://drawdown.press/",
      "description": "Press-side color correction for printers and sign shops. Enter the color you want and the color you're getting — Drawdown tells you which inks to move to make them match.",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Color Management",
      "operatingSystem": "Web Browser",
      "browserRequirements": "Requires modern browser with JavaScript",
      "image": "https://drawdown.press/drawdown-og.png",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free web app for press-side color correction"
        },
        {
          "@type": "Offer",
          "name": "Drawdown Pro (Monthly)",
          "price": "8.99",
          "priceCurrency": "USD",
          "description": "Pro subscription with ICC press profiles, spectrophotometer Lab entry, per-client tolerances, and job-ticket export"
        },
        {
          "@type": "Offer",
          "name": "Drawdown Pro (Annual)",
          "price": "79.00",
          "priceCurrency": "USD",
          "description": "Annual Pro subscription"
        }
      ],
      "creator": {
        "@type": "Person",
        "name": "A working prepress and signwriting professional",
        "jobTitle": "Journeyman Signwriter and Prepress Architect"
      }
    }
    </script>
  </head>
