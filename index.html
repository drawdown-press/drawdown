<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (the two-panel Drawdown mark). Real files at real paths so
         Google's favicon crawler indexes them for the SERP, not just browser tabs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary SEO -->
    <title>Drawdown — Press-Side Color Correction for Printers &amp; Sign Shops</title>
    <meta name="description" content="Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move. Free in your browser, no signup. Built for press operators, prepress, and wide-format sign shops." />
    <meta name="keywords" content="color correction, CMYK, Pantone to CMYK, prepress, ink correction, Delta E, wide format color, sign shop color, press color matching, GRACoL, color management" />
    <meta name="author" content="Drawdown" />
    <link rel="canonical" href="https://drawdown.press/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, most link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drawdown" />
    <meta property="og:title" content="Drawdown — Press-Side Color Correction" />
    <meta property="og:description" content="Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move. Free in your browser, no signup." />
    <meta property="og:url" content="https://drawdown.press/" />
    <meta property="og:image" content="https://drawdown.press/drawdown-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Drawdown — press-side color correction tool" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Drawdown — Press-Side Color Correction" />
    <meta name="twitter:description" content="Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move. Free in your browser." />
    <meta name="twitter:image" content="https://drawdown.press/drawdown-og.png" />

    <!-- Structured data: tells Google this is a software application, free tier, browser-based -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Drawdown",
      "url": "https://drawdown.press/",
      "description": "Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move.",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Color Management",
      "operatingSystem": "Web Browser",
      "browserRequirements": "Requires modern browser with JavaScript",
      "image": "https://drawdown.press/drawdown-og.png",
      "offers": {
        "@type": "Offer",
        "name": "Free",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free web app for press-side color correction"
      },
      "creator": {
        "@type": "Person",
        "name": "A working prepress and signwriting professional",
        "jobTitle": "Journeyman Signwriter and Prepress Architect"
      }
    }
    </script>

    <!-- FAQ schema: Google can show these as rich-result accordions on the SERP. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does Drawdown do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Drawdown is a press-side color-correction tool. You enter the color you want and the color you're getting, and it tells you which inks to move and by how much to close the gap. It accounts for the material you're printing on, so you aren't fighting the substrate blind. It runs in your browser, no signup."
          }
        },
        {
          "@type": "Question",
          "name": "Why don't free Pantone to CMYK converters work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most free Pantone to CMYK converters hand you a static set of numbers from an undocumented formula and call it a conversion. The real conversion depends on your press, your ink, and the substrate you're printing on. A number pulled off a lookup table doesn't know what you're printing on, so it prints too faint, off-cast, and leaves you color-matching from scratch anyway. Drawdown skips the lookup and matches the color against what you're actually printing."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a spectrophotometer to use Drawdown?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The free tier is built for eyeball matching. You enter the target color and what you're seeing on press, and Drawdown hands you the correction. A spectrophotometer makes the match tighter and will be supported in the Pro tier, but it isn't required to use the tool."
          }
        },
        {
          "@type": "Question",
          "name": "Does Drawdown work for digital printing or just offset?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Both. The underlying math is CMYK and works the same whether you're on an offset press, a wide-format digital printer, a flatbed, or a solvent machine. Press operators and sign shops use it on all of these. The substrate accounting is what matters, not the press type."
          }
        },
        {
          "@type": "Question",
          "name": "What is a drawdown?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A drawdown is a test print of an ink on the actual stock, pulled before a run to confirm the color is right. It's the pressman's reality check. The tool is named after it because that's exactly what it does, numerically: pull a test, compare it to the target, and tell you how to adjust."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate are the ink corrections?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Accurate enough to put you in the right neighborhood on the first try instead of after four. The free tier uses a generic press model, so it's honest ballpark, not final-color precision. Pair it with your eye and a good viewing booth and it gets you close fast. The Pro tier adds ICC profiles and spectro input for tighter matches."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
