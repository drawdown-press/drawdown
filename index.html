<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (the two-panel Drawdown mark). Real files at real paths so
         Google's favicon crawler indexes them for the SERP, not just browser tabs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary SEO -->
    <title>Drawdown — Press-Side Color Correction for Printers &amp; Sign Shops</title>
    <meta name="description" content="Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move. Free in your browser, no signup. Built for press operators, prepress, and wide-format sign shops." />
    <meta name="keywords" content="color correction, CMYK, Pantone to CMYK, prepress, ink correction, Delta E, wide format color, sign shop color, press color matching, GRACoL, color management" />
    <meta name="author" content="Drawdown" />
    <link rel="canonical" href="https://drawdown.press/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, most link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drawdown" />
    <meta property="og:title" content="Drawdown — Press-Side Color Correction" />
    <meta property="og:description" content="Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move. Free in your browser, no signup." />
    <meta property="og:url" content="https://drawdown.press/" />
    <meta property="og:image" content="https://drawdown.press/drawdown-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Drawdown — press-side color correction tool" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Drawdown — Press-Side Color Correction" />
    <meta name="twitter:description" content="Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move. Free in your browser." />
    <meta name="twitter:image" content="https://drawdown.press/drawdown-og.png" />

    <!-- Structured data: tells Google this is a software application, free tier, browser-based -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Drawdown",
      "url": "https://drawdown.press/",
      "description": "Color matching for printers and prepress. Enter the color you want and the color you're getting, and Drawdown tells you which inks to move.",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Color Management",
      "operatingSystem": "Web Browser",
      "browserRequirements": "Requires modern browser with JavaScript",
      "image": "https://drawdown.press/drawdown-og.png",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free web app for press-side color correction"
        },
        {
          "@type": "Offer",
          "name": "Drawdown Pro (Monthly)",
          "price": "8.99",
          "priceCurrency": "USD",
          "description": "Pro subscription with ICC press profiles, spectrophotometer Lab entry, per-client tolerances, and job-ticket export"
        },
        {
          "@type": "Offer",
          "name": "Drawdown Pro (Annual)",
          "price": "79.00",
          "priceCurrency": "USD",
          "description": "Annual Pro subscription"
        }
      ],
      "creator": {
        "@type": "Person",
        "name": "A working prepress and signwriting professional",
        "jobTitle": "Journeyman Signwriter and Prepress Architect"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
